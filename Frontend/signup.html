<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy - Sign Up</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/signupStyles.css">
</head>
<body>
    <div class="container">
        <div class="auth-wrapper">
            <!-- Logo -->
            <div class="logo-section">
                <div class="logo-container">
                    <div class="logo-icon">
                        <span>F</span>
                    </div>
                    <h1 class="logo-text">FitBuddy</h1>
                </div>
            </div>

            <!-- Signup Card -->
            <div class="auth-card">
                <div class="card-header">
                    <h2 class="card-title">Join FitBuddy</h2>
                    <p class="card-description">Start your fitness journey today!</p>
                </div>

                <div class="card-content">
                    <form id="signupForm" class="auth-form">
                        <!-- Name Fields -->
                        <div class="form-row">
                            <div class="form-group">
                                <label for="firstName" class="form-label">First Name</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-user input-icon"></i>
                                    <input 
                                        type="text" 
                                        id="firstName" 
                                        name="firstName"  
                                        class="form-input"
                                        required
                                    >
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="lastName" class="form-label">Last Name</label>
                                <input 
                                    type="text" 
                                    id="lastName" 
                                    name="lastName" 
                                    class="form-input"
                                    required
                                >
                            </div>
                        </div>

                        <!-- Email Field -->
                        <div class="form-group">
                            <label for="email" class="form-label">Email</label>
                            <div class="input-wrapper">
                                <i class="fas fa-envelope input-icon"></i>
                                <input 
                                    type="email" 
                                    id="email" 
                                    name="email" 
                                    class="form-input"
                                    required
                                >
                            </div>
                        </div>

                        <!-- Password Field -->
                        <div class="form-group">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-wrapper">
                                <i class="fas fa-lock input-icon"></i>
                                <input 
                                    type="password" 
                                    id="password" 
                                    name="password" 
                                    placeholder="Create a strong password" 
                                    class="form-input"
                                    required
                                >
                                <button type="button" class="password-toggle" id="passwordToggle">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Confirm Password Field -->
                        <div class="form-group">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                            <div class="input-wrapper">
                                <i class="fas fa-lock input-icon"></i>
                                <input 
                                    type="password" 
                                    id="confirmPassword" 
                                    name="confirmPassword" 
                                    placeholder="Confirm your password" 
                                    class="form-input"
                                    required
                                >
                                <button type="button" class="password-toggle" id="confirmPasswordToggle">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Terms and Conditions -->
                        <div class="checkbox-group">
                            <input type="checkbox" id="agreeToTerms" name="agreeToTerms" class="checkbox" required>
                            <label for="agreeToTerms" class="checkbox-label">
                                I agree to the 
                                <a href="#" class="terms-link">Terms of Service</a> 
                                and 
                                <a href="#" class="terms-link">Privacy Policy</a>
                            </label>
                        </div>

                        <!-- Sign Up Button -->
                        <button type="submit" class="btn-primary" id="signupBtn" disabled>Create Account</button>

                        <!-- Divider -->
                        <div class="divider">
                            <span class="divider-text">Or continue with</span>
                        </div>

                        <!-- Google Signup -->
                        <button type="button" class="btn-social" id="googleSignup">
                            <svg class="social-icon" viewBox="0 0 24 24">
                                <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                            </svg>
                            Continue with Google
                        </button>

                        <!-- Login Link -->
                        <div class="auth-switch">
                            <p class="switch-text">
                                Already have an account? 
                                <a href="login.html" class="switch-link">Sign in</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="js/signupScript.js">
        
    </script>
</body>
</html>
